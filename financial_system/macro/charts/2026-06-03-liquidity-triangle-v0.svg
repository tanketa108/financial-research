<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="100%" height="100%" fill="#f8fbff"/>
<text x="40" y="32" font-family="Inter, Arial" font-size="20" font-weight="700" fill="#0f172a">Liquidity triangle — window change</text>
<text x="40" y="56" font-family="Inter, Arial" font-size="12" fill="#475569">TGA rising drains reserves; RRP falling can offset; reserve balances are the direct cross-check.</text>
<line x1="510.0" y1="78" x2="510.0" y2="270" stroke="#94a3b8" stroke-width="1"/>
<text x="506.0" y="292" font-family="Inter, Arial" font-size="11" fill="#64748b">0</text>
<text x="40" y="123" font-family="Inter, Arial" font-size="15" font-weight="600" fill="#0f172a">TGA</text>
<rect x="490.9" y="105" width="19.1" height="28" rx="7" fill="#2563eb" opacity="0.88"/>
<text x="408.9" y="124" font-family="Inter, Arial" font-size="13" font-weight="600" fill="#0f172a">$-1.7bn</text>
<text x="40" y="193" font-family="Inter, Arial" font-size="15" font-weight="600" fill="#0f172a">RRP</text>
<rect x="510.0" y="175" width="9.1" height="28" rx="7" fill="#0f766e" opacity="0.88"/>
<text x="531.1" y="194" font-family="Inter, Arial" font-size="13" font-weight="600" fill="#0f172a">+$0.8bn</text>
<text x="40" y="263" font-family="Inter, Arial" font-size="15" font-weight="600" fill="#0f172a">Reserves</text>
<rect x="180.0" y="245" width="330.0" height="28" rx="7" fill="#7c3aed" opacity="0.88"/>
<text x="98.0" y="264" font-family="Inter, Arial" font-size="13" font-weight="600" fill="#0f172a">$-29.4bn</text>
<text x="40" y="330" font-family="Inter, Arial" font-size="11" fill="#64748b">Sources: Treasury FiscalData DTS, NY Fed Markets API, FRED public CSV WRESBAL. Units converted to USD billions for display.</text>
